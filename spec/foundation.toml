# Foundation libraries, format version 1 (spec section 4).
#
# This is the machine-readable form of the spec's foundation table. Tools use
# it to decide which libraries a bundle must not contain, and platforms use it
# as the minimum they must install.
#
# Each [[component]] has:
#   id             stable name of the component
#   summary        what it is
#   requires       manifest `requires.*` keys checked against this component
#   symbol_prefix  ELF symbol version prefix used to detect `requires` (e.g. GLIBC_2.39)
#   sonames        libraries every platform must install; bundles must not contain them
#   never_bundle   file name patterns (`*` matches anything) of driver-internal
#                  libraries. Bundles must not contain them, but platforms need
#                  not install them all (they depend on the GPU)
#
# A platform's own copy (/usr/share/app/foundation.toml, generated from its
# build) uses the same layout, may add sonames to any component, never drops
# one, and adds a [provides] table with the versions it provides:
#
#   [provides]
#   glibc = "2.40"
#   libstdcxx = "3.4.33"
#   vulkan = "1.3"
#   gles = "3.2"
#   gl = "4.6"
#   libva = "1.22"

format = 1

[[component]]
id = "glibc"
summary = "C library and dynamic loader"
requires = ["glibc"]
symbol_prefix = "GLIBC_"
sonames = [
    "ld-linux-x86-64.so.2",
    "ld-linux-aarch64.so.1",
    "libc.so.6",
    "libm.so.6",
    "libmvec.so.1",
    "libpthread.so.0",
    "libdl.so.2",
    "librt.so.1",
    "libresolv.so.2",
    "libutil.so.1",
    "libanl.so.1",
    "libBrokenLocale.so.1",
    "libthread_db.so.1",
    "libc_malloc_debug.so.0",
    "libnss_files.so.2",
    "libnss_dns.so.2",
    "libnss_compat.so.2",
]

[[component]]
id = "cxx-runtime"
summary = "C++ runtime (libstdc++, libgcc_s)"
requires = ["libstdcxx"]
symbol_prefix = "GLIBCXX_"
sonames = ["libstdc++.so.6", "libgcc_s.so.1"]

[[component]]
id = "vulkan"
summary = "Vulkan loader"
requires = ["vulkan"]
sonames = ["libvulkan.so.1"]
never_bundle = ["libvulkan_*.so"]

[[component]]
id = "libglvnd"
summary = "OpenGL, GLX, EGL and OpenGL ES dispatch (libglvnd)"
requires = ["gl", "gles"]
sonames = [
    "libGL.so.1",
    "libGLX.so.0",
    "libOpenGL.so.0",
    "libEGL.so.1",
    "libGLESv2.so.2",
    "libGLESv1_CM.so.1",
    "libGLdispatch.so.0",
]
never_bundle = ["libGLX_*.so.*", "libEGL_*.so.*"]

[[component]]
id = "mesa"
summary = "Mesa drivers, libdrm, libgbm"
sonames = ["libdrm.so.2", "libgbm.so.1"]
never_bundle = [
    "libdrm_*.so.*",
    "libglapi.so.*",
    "libgallium*.so",
    "*_dri.so",
    # GPU-specific libraries some drivers link (checked on Mesa 26.2)
    "libLLVM*",
    "libSPIRV-Tools*",
    "libelf.so.*",
    "libelf-*.so",
    "libdisplay-info.so.*",
]

[[component]]
id = "x11-driver-libs"
summary = "X11 client libraries the GPU drivers are built against (guaranteed set)"
sonames = [
    "libX11.so.6",
    "libX11-xcb.so.1",
    "libxcb.so.1",
    "libxcb-glx.so.0",
    "libxcb-dri2.so.0",
    "libxcb-dri3.so.0",
    "libxcb-present.so.0",
    "libxcb-sync.so.1",
    "libxcb-xfixes.so.0",
    "libxcb-randr.so.0",
    "libxcb-shm.so.0",
    "libXext.so.6",
    "libXfixes.so.3",
    "libXxf86vm.so.1",
    "libxshmfence.so.1",
    "libXau.so.6",
    "libXdmcp.so.6",
]

[[component]]
id = "driver-deps"
summary = "Libraries every GPU driver is built against (guaranteed set)"
# Checked with readelf on Mesa 26.2 (Fedora 44, aarch64): every Mesa driver
# links zlib, zstd and expat, every Vulkan driver links libudev, and libffi
# comes with libwayland-client.
sonames = ["libz.so.1", "libzstd.so.1", "libexpat.so.1", "libudev.so.1", "libffi.so.8"]

[[component]]
id = "libva"
summary = "Video acceleration (libva)"
requires = ["libva"]
sonames = ["libva.so.2", "libva-drm.so.2", "libva-wayland.so.2"]
never_bundle = ["*_drv_video.so"]

[[component]]
id = "wayland"
summary = "Wayland client libraries and libxkbcommon"
sonames = [
    "libwayland-client.so.0",
    "libwayland-cursor.so.0",
    "libwayland-egl.so.1",
    "libxkbcommon.so.0",
]

[[component]]
id = "audio"
summary = "PipeWire client and ALSA"
sonames = ["libpipewire-0.3.so.0", "libasound.so.2"]
