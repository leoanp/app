name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    # Must match `rust-version` in Cargo.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libseccomp-dev
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # `+1.88` overrides rust-toolchain.toml, which asks for stable.
      - run: cargo +1.88 check --workspace --all-targets
  # The sandbox escape tests need root and Linux 6.12+ (GitHub's runners are
  # older), so they are ignored here and run by tests/vm/sandbox-tests.sh.
  # A virtme-ng job will run them in CI later.
