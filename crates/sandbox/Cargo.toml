[package]
name = "app-sandbox"
description = "Apply cgroup, uid/gid switch, no_new_privs, Landlock and seccomp before exec (spec section 7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror = "2.0.21"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
libc = "0.2.189"
libseccomp = "0.4.0"
rustix = { version = "1.1.5", features = ["process", "thread", "fs", "system", "mount"] }

[dev-dependencies]
tempfile = "3.27.0"
